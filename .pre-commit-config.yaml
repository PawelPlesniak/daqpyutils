repos:
  - repo: local
    hooks:
      - id: ruff
        name: Check linting with Ruff
        entry: ruff check .
        language: system
        types: [python]

      - id: pytest
        name: Run tests with pytest
        entry: pytest -v tests/ --tb=short --disable-warnings
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-mypy
        name: Type check with mypy
        entry: mypy src/
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-doctest
        name: Run doctests with pytest
        entry: pytest --doctest-modules src/ --ignore=tests/ --ignore=docs/
        language: system
        types: [python]
        pass_filenames: false
