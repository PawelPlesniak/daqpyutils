# Run pytests with mypy, doctests, and coverage inside DUNE Container (Agnostic Template)
name: Test, Type Check, and Coverage

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/dune-daq/nightly-release-alma9:development_v5

    steps:
      # 1. Checkout the current commit repository directly into the container workspace
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Initialize your DUNE Workarea using the image's internal CVMFS
      - name: Set up dev nightly
        if: ${{ !cancelled() }}
        run: |
          mkdir -p nightly
          cd nightly
          source /cvmfs/dunedaq.opensciencegrid.org/setup_dunedaq.sh
          setup_dbt latest
          dbt-create -n last_fddaq

      # 3. Handle variables, completely agnostic clone, and test execution
      - name: Setup Python environment, install package, and run tests
        if: success()
        run: |
          # 1. Dynamically extract the repository name
          REPO_NAME="${{ github.event.repository.name }}"
          echo "Target repository name resolved to: $REPO_NAME"

          # 2. Resolve active branch name cleanly across push and PR events
          BRANCH="${{ github.head_ref || github.ref_name }}"
          echo "Target testing branch resolved to: $BRANCH

          # 3. Source your DUNE workarea environment
          cd nightly/NFD_DEV*
          source env.sh
          
          # 4. Move to the pythoncode path
          cd pythoncode
          
          # 5. Clone this repository into a target directory
          if [ "${{ github.event_name }}" = "pull_request" ]; then
              git clone "https://github.com/${{ github.event.pull_request.head.repo.full_name }}.git" -b "$BRANCH" target_repo || \
              git clone "https://github.com/${{ github.repository }}.git" -b "$BRANCH" target_repo
          else
              git clone "https://github.com/${{ github.repository }}.git" -b "$BRANCH" target_repo
          fi
          
          cd target_repo
          python -m pip install --upgrade pip
          pip install .[test]

          # 6. Execute tests
          pytest --junitxml=junit/test-results.xml --cov=. --cov-report=xml --cov-report=html
          echo "TARGET_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Publish JUnit test report
        uses: mikepenz/action-junit-report@v5
        if: ${{ !cancelled() }}
        with:
          report_paths: '${{ env.TARGET_DIR }}/junit/test-results.xml'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.TARGET_DIR }}/coverage.xml