# Run pytests with mypy, doctests, and coverage inside DUNE Container (Agnostic Template)
name: Test, Type Check, and Coverage

on:
  # Run on any pushes to the main branch which releases are generated from
  push:
    branches:
      - develop
      - 'prep-release/**'

  # Run on any pull requests targeting the main branch which releases are generated from
  pull_request:
    branches:
      - develop
      - 'prep-release/**'

# Cancel any running jobs for this same branch if a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/dune-daq/nightly-release-alma9:development_v5

    steps:
      # 1. Checkout the current commit repository directly into the container workspace
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Initialize your DUNE Workarea using the image's internal CVMFS
      - name: Set up dev nightly
        if: ${{ !cancelled() }}
        run: |
          mkdir -p nightly
          cd nightly
          source /cvmfs/dunedaq.opensciencegrid.org/setup_dunedaq.sh
          setup_dbt latest
          dbt-create -n last_fddaq

      # 3. Handle variables, completely agnostic clone, and test execution
      - name: Setup Python environment, clone package, build workarea, and run tests
        if: success()
        run: |
          # 1. Resolve active branch and repository name metadata
          BRANCH="${{ github.head_ref || github.ref_name }}"
          REPO_NAME="${{ github.event.repository.name }}"
          echo "Target branch: $BRANCH | Target repository: $REPO_NAME"

          # 2. Source baseline DUNE toolchain variables
          source /cvmfs/dunedaq.opensciencegrid.org/setup_dunedaq.sh
          setup_dbt latest
          
          # 3. Enter the created nightly workspace
          cd nightly/NFD_DEV*
          
          # 4. Move to the standard pythoncode directory location
          cd pythoncode
          
          # 5. Clone the relevant repo
          if [ "${{ github.event_name }}" = "pull_request" ]; then
              git clone "https://github.com/${{ github.event.pull_request.head.repo.full_name }}.git" -b "$BRANCH" "$REPO_NAME" || \
              git clone "https://github.com/${{ github.repository }}.git" -b "$BRANCH" "$REPO_NAME"
          else
              git clone "https://github.com/${{ github.repository }}.git" -b "$BRANCH" "$REPO_NAME"
          fi
          
          # 6. Step back to root workarea to compile everything securely
          cd ../..
          source env.sh
          dbt-build
          dbt-workarea-env

          # 7. Navigate directly into the package directory to install dependencies and test
          cd pythoncode/"$REPO_NAME"
          python -m pip install --upgrade pip
          pip install .[test]

          # 8. Execute testing engine
          pytest --junitxml=junit/test-results.xml --cov=. --cov-report=xml --cov-report=html
          echo "TARGET_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Publish JUnit test report
        uses: mikepenz/action-junit-report@v5
        if: ${{ !cancelled() }}
        with:
          report_paths: '${{ env.TARGET_DIR }}/junit/test-results.xml'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.TARGET_DIR }}/coverage.xml